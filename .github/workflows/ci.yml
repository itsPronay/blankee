name: Build Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleGplayRelease assembleFdroidRelease

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/gplay/release/*.apk app/build/outputs/apk/gplay/release/blankee-gplay.apk
          mv app/build/outputs/apk/fdroid/release/*.apk app/build/outputs/apk/fdroid/release/blankee-fdroid.apk

      - name: Upload Gplay APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: blankee-gplay
          path: app/build/outputs/apk/gplay/release/blankee-gplay.apk
          archive: false

      - name: Upload Fdroid APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: blankee-fdroid
          path: app/build/outputs/apk/fdroid/release/blankee-fdroid.apk
          archive: false
